name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk calendar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-apk
          path: calendar.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" calendar.apk \
            --title "내 달력 v1.0.${{ github.run_number }}" \
            --notes "폰에서 calendar.apk를 받아 설치하세요." --latest
      # A build started by hand from a feature branch becomes a pre-release, so it can be
      # downloaded straight to a phone for trying out. It never becomes the "latest" release.
      - name: Publish preview
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${{ github.run_number }}" calendar.apk \
            --target "${{ github.sha }}" \
            --title "내 달력 미리보기 ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "써 보기용 빌드예요. 폰에서 calendar.apk를 받아 설치하세요." --prerelease --latest=false
